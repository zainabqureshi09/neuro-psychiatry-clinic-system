# ==============================================================================
# Nginx Reverse Proxy Configuration - NPCS Psychiatry EMR
# Save to: /etc/nginx/sites-available/emr.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/emr.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Active Pre-SSL HTTP Server Block (Port 80)
# Proxies /api/ -> 127.0.0.1:5000 (Express) and / -> 127.0.0.1:3000 (Next.js)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum Body Size for Attachments / Exports
    client_max_body_size 25M;

    # Certbot acme-challenge verification path (ready for domain SSL cutover)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy Express Backend API (127.0.0.1:5000)
    # Note: Security headers for /api/ are set directly by Express securityMiddleware.ts.
    # X-Forwarded-For is overwritten with $remote_addr so clients cannot spoof IP headers.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Proxy Next.js Frontend App (127.0.0.1:3000)
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

